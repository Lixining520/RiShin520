<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生存战争 · 卡密领取</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--green:#3fb950;--green-d:#238636;--txt:#e6edf3;--sub:#8b949e;--accent:#58a6ff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 50% -20%,#1b2735,#0d1117 60%);color:var(--txt);min-height:100vh;padding:20px;display:flex;align-items:center;justify-content:center}
  .box{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px}
  .logo{font-size:40px;text-align:center;margin-bottom:6px}
  h2{font-size:20px;text-align:center;margin-bottom:16px}
  .row{display:flex;gap:10px}
  input{background:#0d1117;border:1px solid var(--line);color:var(--txt);padding:12px;border-radius:8px;font-size:14px;outline:none;flex:1}
  input:focus{border-color:var(--accent)}
  .btn{background:var(--green-d);color:#fff;border:none;padding:12px 18px;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600}
  .btn:hover{background:var(--green)}
  .msg{font-size:13px;margin-top:12px;text-align:center;min-height:18px}
  .err{color:#f85149}
  .ok{color:var(--green)}
  .hidden{display:none}
  .step{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
  .step:last-child{border-bottom:none}
  .num{flex:0 0 26px;height:26px;background:var(--green-d);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  .step .t{font-size:14px;line-height:1.7}
  .step .t b{color:var(--accent)}
  .code{margin-top:6px;background:#0d1117;border:1px dashed var(--line);border-radius:8px;padding:10px;font-family:Consolas,monospace;font-size:13px;word-break:break-all}
  .note{font-size:12px;color:var(--sub);margin-top:18px;text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="box" id="loginBox">
  <div class="logo">⚔️</div>
  <h2>生存战争 · 卡密验证</h2>
  <div class="row">
    <input id="keyInput" placeholder="请输入卡密" autocomplete="off">
    <button class="btn" id="loginBtn">验证</button>
  </div>
  <div class="msg" id="loginMsg"></div>
</div>

<div class="box hidden" id="infoBox">
  <div class="logo">⚔️</div>
  <h2>生存战争 · 进服说明</h2>
  <div class="step"><div class="num">1</div><div class="t">卡密验证通过，一人一码，请妥善保管。</div></div>
  <div class="step"><div class="num">2</div><div class="t">启动游戏，连接服务器：<div class="code" id="ip">ovo.fucku.top:28887</div></div></div>
  <div class="step"><div class="num">3</div><div class="t">进入游戏后，在聊天框输入：<div class="code">/login 你的卡密</div>验证通过后即可正常游玩。</div></div>
  <div class="step"><div class="num">4</div><div class="t">若提示<b>卡密错误</b>，请检查大小写或联系管理员重新发放。</div></div>
  <p class="note">本页面仅用于发放与说明，验证在服务端完成。</p>
</div>

<script>
var VALID_KEYS = [
  "LIXIN-XFNQWY98SPYU",
  "LIXIN-GXH72VXM5H6W",
  "LIXIN-S7C2F7ZSMK92",
  "LIXIN-Y55XRGG9PZRE",
  "LIXIN-5VTR5K2M5U7L",
  "LIXIN-BHXKBQJXZJX5",
  "LIXIN-GRG7E99A5PQV",
  "LIXIN-WXNRPKB5FDZW",
  "LIXIN-BAF6QJCT69EP",
  "LIXIN-RKA5YNPL9SKR",
  "LIXIN-UNBNT66X94XZ",
  "LIXIN-L8PDJB9WN8Y8",
  "LIXIN-EJQU36E2Z4F8",
  "LIXIN-GZLG39YMA4A7",
  "LIXIN-WR6Z8ZVNGLSC",
  "LIXIN-MDBVZDXYXNTG",
  "LIXIN-JJFKQYXPEP5R",
  "LIXIN-CLTT3EWQM68Z",
  "LIXIN-UKBMNZECNS3K",
  "LIXIN-GQXA34A9U7T4"
];
var $ = function(id){ return document.getElementById(id); };
function check(){
  var v = $("keyInput").value.trim().toUpperCase();
  if(!v){ $("loginMsg").className="msg err"; $("loginMsg").textContent="请输入卡密"; return; }
  if(VALID_KEYS.indexOf(v) >= 0){
    $("loginBox").classList.add("hidden");
    $("infoBox").classList.remove("hidden");
  } else {
    $("loginMsg").className="msg err";
    $("loginMsg").textContent="卡密错误，请重试";
  }
}
$("loginBtn").onclick = check;
$("keyInput").addEventListener("keydown", function(e){ if(e.key==="Enter") check(); });
</script>
</body>
</html>
